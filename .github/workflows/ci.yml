name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          check-latest: true
          cache: true
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: the committed assembly is the generator's output
        run: |
          go run ./tools/genblamka > /tmp/blamka_arm64.s
          diff /tmp/blamka_arm64.s blamka_arm64.s

  # Targets without a native runner: they must build and vet, and the pure Go
  # fallbacks they select are the code x/crypto/argon2 runs.
  cross:
    name: build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [386, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          check-latest: true
          cache: true
      - name: vet and build tests
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go vet ./...
          go test -c -o /dev/null .
